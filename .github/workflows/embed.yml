name: embed

# Builds tor + pluggable transports from pinned upstream sources on native
# runners and commits the artifacts under internal/embed/bin/ for go:embed.
# Run manually (Actions tab) or after changing pins. Resolves the latest
# stable tor tag when no tag is given; SHA256 of every artifact is recorded
# in internal/embed/manifest.txt.

on:
  workflow_dispatch:
    inputs:
      tor_tag:
        description: "tor tag (empty = latest stable from GitLab)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tor_tag: ${{ steps.tag.outputs.tor_tag }}
    steps:
      - id: tag
        run: |
          if [ -n "${{ github.event.inputs.tor_tag }}" ]; then
            echo "tor_tag=${{ github.event.inputs.tor_tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(curl -fsSL "https://gitlab.torproject.org/api/v4/projects/tpo%2Fcore%2Ftor/repository/tags?per_page=100" \
              | jq -r '[.[] | .name | select(test("^tor-[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')
            echo "tor_tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tor tag: $TAG"

  build-linux:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      # Third-party apt sources on the runner image (e.g. Google Chrome)
      # intermittently publish hash mismatches; we only need the main repos.
      - run: sudo apt-get update || true
      - run: sudo apt-get install -y libevent-dev libssl-dev zlib1g-dev autoconf automake libtool pkg-config
      - name: Fetch tor source (hash-pinned)
        run: |
          VER=${{ needs.resolve.outputs.tor_tag }}
          URL="https://dist.torproject.org/tor-${VER#tor-}.tar.gz"
          curl -fsSLo tor.tar.gz "$URL"
          # macOS lacks coreutils' sha256sum; shasum is always present.
          SHA_CMD="sha256sum"; command -v sha256sum >/dev/null || SHA_CMD="shasum -a 256"
          echo "TAR_SHA=$($SHA_CMD tor.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar xzf tor.tar.gz && mv "tor-${VER#tor-}" tor-src
      - name: Build static tor
        run: |
          cd tor-src
          # tor >= 0.4.8 tarballs dropped autogen.sh; bootstrap either way.
          if [ -x ./autogen.sh ]; then ./autogen.sh; else autoreconf -fi; fi
          # Static openssl/libevent/zlib; glibc stays dynamic (NSS limits).
          ./configure --disable-gcc-hardening \
            --with-zlib-dir=/usr --with-libevent-dir=/usr --with-openssl-dir=/usr \
            LDFLAGS="-Wl,-Bstatic -lssl -lcrypto -levent -lz -Wl,-Bdynamic -lpthread -ldl -lm"
          make -j"$(nproc)"
          strip src/app/tor
          file src/app/tor
          ldd src/app/tor || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tor-linux-amd64
          path: tor-src/src/app/tor
      - name: Record hashes
        run: echo "tor-linux-amd64 sha256=$(sha256sum tor-src/src/app/tor | cut -d' ' -f1) tarball=$TAR_SHA" >> hashes.txt

  build-windows:
    needs: resolve
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make autoconf automake libtool pkg-config mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libevent mingw-w64-x86_64-openssl mingw-w64-x86_64-zlib
      - name: Fetch tor source (hash-pinned)
        run: |
          VER=${{ needs.resolve.outputs.tor_tag }}
          URL="https://dist.torproject.org/tor-${VER#tor-}.tar.gz"
          curl -fsSLo tor.tar.gz "$URL"
          SHA_CMD="sha256sum"; command -v sha256sum >/dev/null || SHA_CMD="shasum -a 256"
          echo "TAR_SHA=$($SHA_CMD tor.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar xzf tor.tar.gz && mv "tor-${VER#tor-}" tor-src
      - name: Build tor
        run: |
          DEPS="$PWD/tor-deps"
          cd tor-src
          if [ -x ./autogen.sh ]; then ./autogen.sh; else autoreconf -fi; fi
          # Fully static: mingw64 ships .a for all three deps.
          ./configure --disable-gcc-hardening \
            --with-zlib-dir=/mingw64 --with-libevent-dir=/mingw64 --with-openssl-dir=/mingw64
          # mingw64's static libcrypto.a needs these Windows system libs.
          make -j"$(nproc)" LDFLAGS="-static" LIBS="-lcrypt32 -lws2_32 -lbcrypt -lgdi32 -liphlpapi"
          strip src/app/tor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tor-windows-amd64
          path: tor-src/src/app/tor.exe
      - name: Record hashes
        run: echo "tor-windows-amd64 sha256=$(sha256sum tor-src/src/app/tor.exe | cut -d' ' -f1) tarball=$TAR_SHA" >> hashes.txt

  build-macos:
    needs: resolve
    runs-on: macos-14
    steps:
      - run: brew install autoconf automake libtool pkg-config
      - name: Build static deps (zlib, openssl, libevent)
        run: |
          # Homebrew bottles ship no static archives, and a tor binary that
          # dynamically links brew dylibs would not run on user Macs. Build
          # pinned upstream sources with --disable-shared into a private prefix.
          DEP="$PWD/tor-deps"; mkdir -p "$DEP"
          build_one() { # name url dir zlib|Configure|configure extra-args...
            n="$1"; u="$2"; d="$3"; kind="$4"; shift 4
            curl -fsSLo "$n.tar.gz" "$u" && tar xzf "$n.tar.gz"
            cd "$d"
            case "$kind" in
              zlib)      ./configure --prefix="$DEP" --static ;;
              Configure) ./Configure --prefix="$DEP" "$@" ;;
              *)         ./configure --prefix="$DEP" "$@" ;;
            esac
            make -j"$(sysctl -n hw.ncpu)" && make install && cd -
          }
          build_one zlib-1.3.1 "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz" zlib-1.3.1 zlib
          build_one openssl-3.4.1 "https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz" openssl-3.4.1 Configure no-shared no-tests
          build_one libevent-2.1.12-stable "https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz" libevent-2.1.12-stable configure --disable-shared --disable-openssl --disable-libevent-regress
      - name: Fetch tor source (hash-pinned)
        run: |
          VER=${{ needs.resolve.outputs.tor_tag }}
          URL="https://dist.torproject.org/tor-${VER#tor-}.tar.gz"
          curl -fsSLo tor.tar.gz "$URL"
          SHA_CMD="sha256sum"; command -v sha256sum >/dev/null || SHA_CMD="shasum -a 256"
          echo "TAR_SHA=$($SHA_CMD tor.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar xzf tor.tar.gz && mv "tor-${VER#tor-}" tor-src
      - name: Build tor
        run: |
          cd tor-src
          if [ -x ./autogen.sh ]; then ./autogen.sh; else autoreconf -fi; fi
          # macOS has no static libc: statically link the three deps,
          # libSystem stays dynamic (present on every macOS install).
          # Xcode CLT provides clang via the cc shim only after license accept;
          # point configure at clang explicitly.
          export CC=clang
          if ! ./configure --disable-gcc-hardening \
            --with-openssl-dir="$DEPS" \
            --with-libevent-dir="$DEPS" \
            --with-zlib-dir="$DEPS" \
            CPPFLAGS="-I$DEPS/include" \
            LIBS="$DEPS/lib/libssl.a $DEPS/lib/libcrypto.a $DEPS/lib/libevent_core.a $DEPS/lib/libevent_extra.a $DEPS/lib/libz.a -lm -liconv"; then
            echo "== config.log (compiler check) =="
            sed -n '/C compiler works/,/config:exit/p' config.log | tail -40 || tail -60 config.log
            exit 1
          fi
          make -j"$(sysctl -n hw.ncpu)"
          strip src/app/tor
          otool -L src/app/tor
      - uses: actions/upload-artifact@v4
        with:
          name: tor-darwin-arm64
          path: |
            tor-src/src/app/tor
            tor-src/src/config/geoip
            tor-src/src/config/geoip6
            tor-src/ChangeLog

  geoip-linux:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Extract GeoIP files
        run: |
          VER=${{ needs.resolve.outputs.tor_tag }}
          curl -fsSLo tor.tar.gz "https://dist.torproject.org/tor-${VER#tor-}.tar.gz"
          echo "tarball sha256=$(sha256sum tor.tar.gz | cut -d' ' -f1)" | tee tarball-sha.txt
          tar xzf tor.tar.gz "tor-${VER#tor-}/src/config/geoip" "tor-${VER#tor-}/src/config/geoip6"
          mkdir -p out && cp tor-*/src/config/geoip tor-*/src/config/geoip6 out/
      - uses: actions/upload-artifact@v4
        with:
          name: geoip
          path: out/*

  transports:
    # obfs4proxy and snowflake-client are pure Go; cross-compile from pins.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: windows, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build obfs4proxy
        run: |
          git clone --depth 1 --branch obfs4proxy-0.0.14 https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/obfs4.git
          cd obfs4/obfs4proxy
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w" -o obfs4proxy .
      - name: Build snowflake-client
        run: |
          git clone --depth 1 --branch v2.11.0 https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake.git
          cd snowflake/client
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w" -o snowflake-client .
      - uses: actions/upload-artifact@v4
        with:
          name: pt-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            obfs4/obfs4proxy/obfs4proxy*
            snowflake/client/snowflake-client*

  embed:
    needs: [resolve, build-linux, build-windows, build-macos, geoip-linux, transports]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage binaries
        run: |
          mkdir -p internal/embed/bin
          mkdir -p internal/embed/geoip
          cp artifacts/tor-linux-amd64/tor        internal/embed/bin/tor-linux-amd64
          cp artifacts/tor-windows-amd64/tor.exe  internal/embed/bin/tor-windows-amd64.exe
          cp artifacts/tor-darwin-arm64/tor       internal/embed/bin/tor-darwin-arm64
          cp artifacts/geoip/geoip  internal/embed/geoip/geoip
          cp artifacts/geoip/geoip6 internal/embed/geoip/geoip6
          for f in artifacts/pt-*/*; do
            base=$(basename "$f")
            osarch="${f#artifacts/pt-}"; osarch="${osarch%/*}"
            case "$base" in
              obfs4proxy*)      cp "$f" "internal/embed/bin/obfs4proxy-$osarch${base#obfs4proxy}" ;;
              snowflake-client*) cp "$f" "internal/embed/bin/snowflake-client-$osarch${base#snowflake-client}" ;;
            esac
          done
          ls -la internal/embed/bin/
      - name: Manifest
        run: |
          {
            echo "# Generated by embed workflow. Do not edit."
            echo "tor_tag=${{ needs.resolve.outputs.tor_tag }}"
            cat artifacts/geoip-linux/tarball-sha.txt 2>/dev/null || true
            echo "obfs4proxy=obfs4proxy-0.0.14"
            echo "snowflake=v2.11.0"
            cd internal/embed/bin
            sha256sum * | sed 's/^/sha256 /'
          } > ../../internal/embed/manifest.txt
          cat internal/embed/manifest.txt
      - name: Commit embedded binaries
        run: |
          git config user.name "Arenaku11"
          git config user.email "315315110+Arenaku11@users.noreply.github.com"
          git add internal/embed
          git commit -m "embed: tor ${{ needs.resolve.outputs.tor_tag }} + obfs4proxy-0.0.14 + snowflake v2.11.0"
          git push origin HEAD:main

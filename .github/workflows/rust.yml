name: rust

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - run: cargo test --locked

  build-windows:
    name: build Windows single-process client
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: target\release\anonssh.exe --version
      - name: Bootstrap in-process Tor
        run: target\release\anonssh.exe --bootstrap-only --state-dir "$env:RUNNER_TEMP\anonssh-arti"
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        with:
          name: anonssh-windows-amd64
          path: target/release/anonssh.exe
